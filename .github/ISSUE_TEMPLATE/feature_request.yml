name: 功能建议
description: 分享一个能让字体安装更省事的点子
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎许愿。真实场景比完整方案更重要，我们可以一起把方案想清楚。
  - type: textarea
    id: scenario
    attributes:
      label: 你在什么场景遇到了麻烦？
      placeholder: 每次从某个字体网站下载后，我需要……
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎样工作？
      placeholder: 如果能……就好了
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 这会为你节省多少麻烦？
      options:
        - 偶尔有帮助
        - 每周都会用到
        - 几乎每次装字体都需要
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么解决？
      description: 可选。现有替代方式有助于理解真实需求。

